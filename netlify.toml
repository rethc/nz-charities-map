# Netlify configuration: https://docs.netlify.com/build/configure-builds/file-based-configuration/
# Routing lives in public/_redirects (/api/* → functions, everything else → index.html).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    # Tiles, styles and fonts: OpenFreeMap. Data and auth: Supabase. Aerial photos: LINZ.
    # Photon is only called directly when the /api/geocode function is unavailable.
    # Using a custom Supabase domain or a different basemap? Add its host here.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://basemaps.linz.govt.nz; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://tiles.openfreemap.org https://basemaps.linz.govt.nz https://photon.komoot.io; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Vite fingerprints everything in /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
