<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12333a" />
    <meta
      name="description"
      content="Every registered charity in Aotearoa New Zealand on one map. Find charities near you, search by name, town or registration number, and filter by cause."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- %SITE_URL% is filled in at build time (see vite.config.ts). The canonical address folds
         shared map links (/?cc=…, /?q=…) into the home page for search engines. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <!-- The site's name in Google results, in place of the bare domain. -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"NZ Charities Map","alternateName":"charities.co.nz","url":"%SITE_URL%/"}</script>
    <!-- Link previews when a map link is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NZ Charities Map" />
    <meta property="og:title" content="NZ Charities Map" />
    <meta
      property="og:description"
      content="Every registered charity in Aotearoa New Zealand on one map. Find charities near you, search by name, town or registration number, and filter by cause."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NZ Charities Map: registered charities across Aotearoa New Zealand" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <title>NZ Charities Map – Find registered charities near you</title>
  </head>
  <body>
    <!-- Also what crawlers that don't run JavaScript (most AI ones) see: point them at the plain pages. -->
    <noscript>
      NZ Charities Map needs JavaScript to show the map. Please turn it on and reload, or
      <a href="/browse/">browse every charity by town and sector</a>.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics. Its two addresses are allowed in the Content-Security-Policy in netlify.toml. -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "386a93b14d574593a653f851e7ffb03e"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
