<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12333a" />
    <meta
      name="description"
      content="Find registered charities across Aotearoa New Zealand on an interactive map. Search by name or registration number and filter by sector."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Link previews when a map link is shared. %SITE_URL% is filled in at build time (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NZ Charities Map" />
    <meta property="og:title" content="NZ Charities Map" />
    <meta
      property="og:description"
      content="Find registered charities across Aotearoa New Zealand on an interactive map. Search by name or registration number and filter by sector."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NZ Charities Map: registered charities across Aotearoa New Zealand" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <title>NZ Charities Map</title>
  </head>
  <body>
    <noscript>NZ Charities Map needs JavaScript to show the map. Please turn it on and reload.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics. Its two addresses are allowed in the Content-Security-Policy in netlify.toml. -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "386a93b14d574593a653f851e7ffb03e"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
